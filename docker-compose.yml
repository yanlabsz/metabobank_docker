# Metabobank Client v3.2 - 用户部署版
# 由 start.sh 自动下载生成，也可手动 docker compose up -d
#
# 注意：本文件刻意不写 container_name，容器名由 compose 自动生成为
#       <目录名>-metabospark-1 形式，因此可以在已有 Metabobank 生产环境的
#       机器上并行部署，不会与 metabospark / mongodb5_client 等固定名冲突。
#
# 环境变量（由 start.sh 写入 .env，也可手动改）：
#   METABOBANK_PORT      Web 主程序端口（默认 8090）
#   METABOBANK_DB_PORT   MongoDB 对外映射端口（默认 27023，容器内固定 27023）
#   METABOBANK_RSERVE_PORT  Rserve 对外端口（默认 6322，容器内固定 6322）
#   METABOBANK_DATA      数据目录（默认 ./metabobank_data，内含 dbs/）

services:
  metabospark:
    image: metabank/metabospark:v3.0
    restart: unless-stopped
    ports:
      - "${METABOBANK_PORT:-8090}:8090"
    environment:
      TZ: Asia/Shanghai
      METABOBANK_DB_HOST: mongodb5_client
      METABOBANK_DB_PORT: "27023"
      MB_RSERVE_HOST: rserve
      MB_RSERVE_PORT: "6322"
      MB_RSERVE_CONNECT_TIMEOUT: "10"
      MB_RSERVE_EVAL_TIMEOUT: "1800"
    volumes:
      - "${METABOBANK_DATA:-./metabobank_data}:/metabobank_data"
    depends_on:
      - mongodb5_client
      - rserve
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - metabobank

  mongodb5_client:
    # 一体化镜像：内置 mongod5_client 二进制 + 配置 + 预置质谱数据快照
    # 首次启动若挂载的 dbs 为空，entrypoint 自动从镜像内置快照复制初始化数据
    image: metabank/mongodb5_client:v3.0
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${METABOBANK_DB_PORT:-27023}:27023"
    volumes:
      - "${METABOBANK_DATA:-./metabobank_data}/dbs:/opt/mongodb5_client/dbs"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/27023 && echo ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - metabobank

  rserve:
    image: metabank/metabospark-omics:v3.0
    restart: unless-stopped
    expose:
      - "6322"
      - "6311"
    volumes:
      - "${METABOBANK_DATA:-./metabobank_data}:/metabobank_data"
    networks:
      - metabobank

networks:
  metabobank:
    driver: bridge
