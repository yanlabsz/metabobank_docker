# Metabobank Client - user deployment file (v3.0 layout, same as
# https://www.metabobank.cn/download)
# Downloaded and verified by start.sh; can also be used manually with
# `docker compose up -d`.
#
# Note: this file intentionally sets no container_name, so containers are named
#       <directory>-metabospark-1 etc. That means it can run side by side with
#       an existing Metabobank production deployment on the same host without
#       clashing with fixed names such as metabospark / mongodb5_client.
#
# Environment variables (written to .env by start.sh, or set manually):
#   METABOBANK_PORT         web port (default 8090)
#   METABOBANK_DB_PORT      published MongoDB port (default 27023)
#   METABOBANK_RSERVE_PORT  Rserve port (default 6322, internal only)
#   METABOBANK_DATA         data directory (default ./metabobank_data, holds dbs/)
services:
  metabospark:
    image: metabank/metabospark:v3.0
    restart: unless-stopped
    ports:
      - "${METABOBANK_PORT:-8090}:8090"
    environment:
      TZ: Asia/Shanghai
      # Reach MongoDB by service name inside the compose network, which
      # overrides any 127.0.0.1 value from .env
      METABOBANK_DB_HOST: mongodb5_client
      METABOBANK_DB_PORT: "27023"
      # Omics analysis via Rserve (the legacy image listens on 6322)
      MB_RSERVE_HOST: rserve
      MB_RSERVE_PORT: "6322"
      MB_RSERVE_CONNECT_TIMEOUT: "10"
      MB_RSERVE_EVAL_TIMEOUT: "1800"
    volumes:
      # Uploaded samples, parsed results and exports
      # (the application uses rootPath=/metabobank_data)
      - "${METABOBANK_DATA:-./metabobank_data}:/metabobank_data"
    depends_on:
      - mongodb5_client
      - rserve
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - metabobank
  mongodb5_client:
    # All-in-one image: mongod5_client binary + configuration + a pre-seeded
    # mass spectrometry data snapshot
    # A production host can mount its own data directory; the entrypoint only
    # seeds the snapshot when the directory is empty and never overwrites data
    image: metabank/mongodb5_client:v3.0
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${METABOBANK_DB_PORT:-27023}:27023"
    volumes:
      - "${METABOBANK_DATA:-./metabobank_data}/dbs:/opt/mongodb5_client/dbs"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/27023 && echo ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - metabobank
  rserve:
    image: metabank/metabospark-omics:v3.0
    restart: unless-stopped
    # Only reachable from metabospark inside the network; no host port is used
    # 6322 is the port Rserve actually listens on (same as the legacy
    # omics_r43:v2.0 image / Dockerfile_omics)
    expose:
      - "6322"
      - "6311"
    # Shares the data volume with metabospark so that R scripts can setwd /
    # Read.TextData on the CSVs and write PNGs back
    volumes:
      - "${METABOBANK_DATA:-./metabobank_data}:/metabobank_data"
    networks:
      - metabobank
networks:
  metabobank:
    driver: bridge
